<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV OU Knowledge Base</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/utilities.css">

    <style>
        /* Legacy compatibility - maps old JS-generated styles to new design system */

        /* Section visibility (used by JS) */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn var(--transition-normal); }

        /* Card styling overrides for JS-generated content */
        .card { margin-bottom: var(--space-4); }
        .card h2 { color: var(--color-sapphire); margin-bottom: var(--space-3); }
        .card h3 { margin-top: var(--space-4); margin-bottom: var(--space-2); }
        .card p, .card li { color: var(--color-text-secondary); }
        .card ul { padding-left: var(--space-5); margin: var(--space-2) 0; list-style: disc; }

        /* Pokemon header in detail view */
        .pokemon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        /* Pokemon link badges (clickable Pokemon names) */
        .pokemon-link { cursor: pointer; }
        .pokemon-link:hover { opacity: 0.8; }

        /* Speed value highlight */
        .speed-value {
            font-family: var(--font-mono);
            font-weight: var(--font-weight-semibold);
            color: var(--color-electric);
        }

        /* Highlight effect for navigation */
        .highlight {
            animation: highlightPulse 2s ease-out;
        }

        @keyframes highlightPulse {
            0% { box-shadow: 0 0 0 4px var(--color-sapphire); }
            100% { box-shadow: none; }
        }

        /* Link tags for cores/archetypes */
        .link-tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            padding: var(--space-1) var(--space-2);
            margin: 2px;
            border-radius: var(--radius-sm);
            background: var(--color-bg-primary);
            border: 1px solid var(--color-sapphire);
            color: var(--color-sapphire);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .link-tag:hover {
            background: var(--color-sapphire);
            color: white;
        }

        .link-tag.team-link {
            border-color: var(--color-emerald);
            color: var(--color-emerald);
        }

        .link-tag.team-link:hover {
            background: var(--color-emerald);
            color: white;
        }

        /* Navigation history buttons - must be above modal */
        .nav-history-buttons {
            display: flex;
            gap: 4px;
            margin-right: var(--space-4);
            padding-right: var(--space-4);
            border-right: 1px solid var(--color-border);
            position: relative;
            z-index: 10000;
        }

        .nav-history-btn {
            background: var(--color-bg-surface);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            position: relative;
            z-index: 10000;
        }

        /* Active/enabled state */
        .nav-history-btn:not(:disabled):hover {
            background: var(--color-sapphire);
            border-color: var(--color-sapphire);
            color: white;
            transform: translateY(-1px);
        }

        .nav-history-btn:not(:disabled):active {
            transform: translateY(0);
        }

        /* Disabled state - looks unavailable, not error */
        .nav-history-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: var(--color-bg-surface);
            border-color: var(--color-border);
            color: var(--color-text-secondary);
        }

        /* Remove any red/error styling */
        .nav-history-btn:disabled::before {
            content: none;
        }

        /* Highlighted set in Pokemon detail */
        .set-highlighted {
            border: 2px solid var(--color-sapphire) !important;
            box-shadow: 0 0 12px rgba(69, 123, 157, 0.4);
        }

        /* Modal scroll lock - when body is locked */
        body.modal-open {
            overflow: hidden !important;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-tabs">
        <div class="nav-history-buttons">
            <button id="nav-back" class="nav-history-btn" onclick="navigateBack()" disabled title="Go Back">←</button>
            <button id="nav-forward" class="nav-history-btn" onclick="navigateForward()" disabled title="Go Forward">→</button>
        </div>
        <a href="#" class="nav-tab active" data-section="pokemon">Pokemon</a>
        <a href="#" class="nav-tab" data-section="metagame">Metagame</a>
        <a href="#" class="nav-tab" data-section="cores">Cores</a>
        <a href="#" class="nav-tab" data-section="archetypes">Archetypes</a>
        <a href="#" class="nav-tab" data-section="teams">Sample Teams</a>
        <a href="#" class="nav-tab" data-section="speed">Speed Tiers</a>
        <a href="#" class="nav-tab" data-section="calculator">Calculator</a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
        <!-- Pokemon Section -->
        <section id="pokemon" class="section active">
            <input type="text" class="search-box" id="pokemon-search" placeholder="Search Pokemon...">
            <div id="pokemon-list"></div>
        </section>

        <!-- Metagame Section -->
        <section id="metagame" class="section">
            <div id="metagame-content"></div>
        </section>

        <!-- Cores Section -->
        <section id="cores" class="section">
            <div id="cores-content"></div>
        </section>

        <!-- Archetypes Section -->
        <section id="archetypes" class="section">
            <div id="archetypes-content"></div>
        </section>

        <!-- Sample Teams Section -->
        <section id="teams" class="section">
            <input type="text" class="search-box" id="teams-search" placeholder="Search teams by name, Pokemon, or archetype...">
            <div id="teams-content"></div>
        </section>

        <!-- Speed Tiers Section -->
        <section id="speed" class="section">
            <div id="speed-content"></div>
        </section>

        <!-- Calculator Section -->
        <section id="calculator" class="section">
            <div class="calc-section">
                <h2 class="card-title mb-4">Damage Calculator</h2>
                <p class="text-secondary mb-4">Select attacker, defender, and move to calculate damage.</p>

                <label class="font-medium text-sm mb-1 block">Attacker:</label>
                <select class="calc-select" id="calc-attacker"></select>

                <label class="font-medium text-sm mb-1 block mt-3">Attacker Set:</label>
                <select class="calc-select" id="calc-attacker-set"></select>

                <label class="font-medium text-sm mb-1 block mt-3">Move:</label>
                <select class="calc-select" id="calc-move"></select>

                <label class="font-medium text-sm mb-1 block mt-3">Defender:</label>
                <select class="calc-select" id="calc-defender"></select>

                <label class="font-medium text-sm mb-1 block mt-3">Defender Set:</label>
                <select class="calc-select" id="calc-defender-set"></select>

                <button class="calc-btn" id="calc-btn">Calculate Damage</button>

                <div class="calc-result hidden" id="calc-result"></div>
            </div>
        </section>
        </div><!-- /.container -->
    </main>

    <!-- Detail View Modal -->
    <div class="detail-view" id="detail-view">
        <div class="detail-content" id="detail-content"></div>
    </div>

    <script>
        // Global data storage
        let pokemonData = {};
        let metagameData = {};
        let sampleTeamsData = {};
        let speedTiersData = {};

        // Type colors
        const typeColors = {
            'Normal': '#A8A878', 'Fire': '#F08030', 'Water': '#6890F0',
            'Electric': '#F8D030', 'Grass': '#78C850', 'Ice': '#98D8D8',
            'Fighting': '#C03028', 'Poison': '#A040A0', 'Ground': '#E0C068',
            'Flying': '#A890F0', 'Psychic': '#F85888', 'Bug': '#A8B820',
            'Rock': '#B8A038', 'Ghost': '#705898', 'Dragon': '#7038F8',
            'Dark': '#705848', 'Steel': '#B8B8D0'
        };

        // =========================
        // Sprite System
        // =========================

        // Normalize Pokemon name for sprite URL (handles special cases)
        function normalizePokemonName(name) {
            if (!name) return '';
            return name
                .toLowerCase()
                .replace(/['']/g, '')      // Remove apostrophes (Mr. Mime -> mr-mime)
                .replace(/[.]/g, '')       // Remove periods (Mr. -> Mr)
                .replace(/♀/g, '-f')       // Female symbol
                .replace(/♂/g, '-m')       // Male symbol
                .replace(/\s+/g, '')       // Remove spaces
                .replace(/:/g, '')         // Remove colons
                .replace(/-o$/g, '-o')     // Keep -o suffix (Porygon2 special case)
                .replace(/é/g, 'e');       // Accent characters
        }

        // Special name mappings for Pokemon Showdown sprites
        const spriteNameMap = {
            'nidoran-f': 'nidoranf',
            'nidoran-m': 'nidoranm',
            'mr.mime': 'mrmime',
            'mr. mime': 'mrmime',
            'ho-oh': 'hooh',
            'porygon2': 'porygon2',
            'porygon-z': 'porygonz'
        };

        // Get sprite URL for a Pokemon (uses Pokemon Showdown Gen 3 sprites)
        function getSpriteUrl(name) {
            let normalized = normalizePokemonName(name);
            // Check for special mappings
            if (spriteNameMap[normalized]) {
                normalized = spriteNameMap[normalized];
            }
            // Pokemon Showdown Gen 3 sprites (front)
            return `https://play.pokemonshowdown.com/sprites/gen3/${normalized}.png`;
        }

        // Get animated sprite URL (for detail views)
        function getAnimatedSpriteUrl(name) {
            let normalized = normalizePokemonName(name);
            if (spriteNameMap[normalized]) {
                normalized = spriteNameMap[normalized];
            }
            // Pokemon Showdown animated sprites
            return `https://play.pokemonshowdown.com/sprites/ani/${normalized}.gif`;
        }

        // Create sprite element with fallback
        function createSprite(name, size = 40, animated = false) {
            const url = animated ? getAnimatedSpriteUrl(name) : getSpriteUrl(name);
            const fallbackInitial = name ? name.charAt(0).toUpperCase() : '?';
            return `<img
                src="${url}"
                alt="${name}"
                class="pokemon-sprite"
                style="width: ${size}px; height: ${size}px; image-rendering: pixelated;"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
            ><span class="sprite-fallback" style="display: none; width: ${size}px; height: ${size}px; font-size: ${Math.floor(size/2)}px;">${fallbackInitial}</span>`;
        }

        // =========================
        // Pokepaste Export
        // =========================

        // Generate Pokepaste format for a set
        function generatePokepaste(pokemonName, ability, set) {
            const lines = [];
            // Pokemon @ Item
            lines.push(`${pokemonName} @ ${set.item}`);
            // Ability
            lines.push(`Ability: ${ability}`);
            // EVs
            lines.push(`EVs: ${set.evs}`);
            // Nature
            const nature = set.nature.split(' / ')[0]; // Take first if multiple options
            lines.push(`${nature} Nature`);
            // Moves
            set.moves.forEach(move => {
                // Clean up move names (handle "Move1 / Move2" options)
                const cleanMove = move.split(' / ')[0];
                lines.push(`- ${cleanMove}`);
            });
            return lines.join('\n');
        }

        // Copy to clipboard function
        function copyPokepaste(pokemonKey, setKey) {
            const mon = pokemonData.pokemon[pokemonKey];
            if (!mon || !mon.sets || !mon.sets[setKey]) return;

            const paste = generatePokepaste(mon.name, mon.ability, mon.sets[setKey]);

            navigator.clipboard.writeText(paste).then(() => {
                // Show feedback
                const btn = document.querySelector(`[data-copy="${pokemonKey}-${setKey}"]`);
                if (btn) {
                    const originalText = btn.textContent;
                    btn.textContent = 'Copied!';
                    btn.classList.add('btn-success');
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.classList.remove('btn-success');
                    }, 1500);
                }
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy to clipboard');
            });
        }

        // Move type database (common ADV OU moves)
        const moveTypes = {
            // Normal
            'Body Slam': 'Normal', 'Double-Edge': 'Normal', 'Explosion': 'Normal', 'Facade': 'Normal',
            'Fake Out': 'Normal', 'Frustration': 'Normal', 'Hyper Beam': 'Normal', 'Protect': 'Normal',
            'Rapid Spin': 'Normal', 'Return': 'Normal', 'Self-Destruct': 'Normal', 'Selfdestruct': 'Normal',
            'Wish': 'Normal', 'Substitute': 'Normal', 'Baton Pass': 'Normal', 'Roar': 'Normal',
            'Whirlwind': 'Normal', 'Belly Drum': 'Normal', 'Soft-Boiled': 'Normal', 'Softboiled': 'Normal',
            'Heal Bell': 'Normal', 'Aromatherapy': 'Normal', 'Sleep Talk': 'Normal', 'Swords Dance': 'Normal',
            // Fire
            'Fire Blast': 'Fire', 'Flamethrower': 'Fire', 'Overheat': 'Fire', 'Will-O-Wisp': 'Fire',
            'Hidden Power Fire': 'Fire', 'HP Fire': 'Fire', 'Sunny Day': 'Fire', 'Fire Punch': 'Fire',
            // Water
            'Surf': 'Water', 'Hydro Pump': 'Water', 'Ice Beam': 'Ice', 'Rain Dance': 'Water',
            'Waterfall': 'Water', 'Hidden Power Water': 'Water',
            // Electric
            'Thunderbolt': 'Electric', 'Thunder': 'Electric', 'Thunder Wave': 'Electric',
            'Hidden Power Electric': 'Electric', 'Volt Tackle': 'Electric',
            // Grass
            'Giga Drain': 'Grass', 'Leech Seed': 'Grass', 'Hidden Power Grass': 'Grass', 'HP Grass': 'Grass',
            'Spore': 'Grass', 'Sleep Powder': 'Grass', 'Stun Spore': 'Grass', 'Synthesis': 'Grass',
            // Ice
            'Ice Beam': 'Ice', 'Blizzard': 'Ice', 'Ice Punch': 'Ice', 'Hidden Power Ice': 'Ice', 'HP Ice': 'Ice',
            // Fighting
            'Focus Punch': 'Fighting', 'Brick Break': 'Fighting', 'Cross Chop': 'Fighting',
            'Hi Jump Kick': 'Fighting', 'Superpower': 'Fighting', 'Mach Punch': 'Fighting',
            'Sky Uppercut': 'Fighting', 'Bulk Up': 'Fighting', 'Counter': 'Fighting',
            // Poison
            'Sludge Bomb': 'Poison', 'Toxic': 'Poison', 'Poison Jab': 'Poison',
            // Ground
            'Earthquake': 'Ground', 'Hidden Power Ground': 'Ground', 'HP Ground': 'Ground',
            'Spikes': 'Ground', 'Sand-Attack': 'Ground',
            // Flying
            'Aerial Ace': 'Flying', 'Drill Peck': 'Flying', 'Hidden Power Flying': 'Flying', 'HP Flying': 'Flying',
            'Sky Attack': 'Flying',
            // Psychic
            'Psychic': 'Psychic', 'Calm Mind': 'Psychic', 'Hypnosis': 'Psychic', 'Rest': 'Psychic',
            'Reflect': 'Psychic', 'Light Screen': 'Psychic', 'Trick': 'Psychic', 'Agility': 'Psychic',
            'Recover': 'Normal', 'Cosmic Power': 'Psychic',
            // Bug
            'Megahorn': 'Bug', 'Signal Beam': 'Bug', 'Hidden Power Bug': 'Bug', 'HP Bug': 'Bug',
            'Silver Wind': 'Bug', 'U-turn': 'Bug',
            // Rock
            'Rock Slide': 'Rock', 'Stone Edge': 'Rock', 'Hidden Power Rock': 'Rock', 'HP Rock': 'Rock',
            'Stealth Rock': 'Rock', 'Rock Tomb': 'Rock', 'Sandstorm': 'Rock',
            // Ghost
            'Shadow Ball': 'Ghost', 'Shadow Punch': 'Ghost', 'Destiny Bond': 'Ghost', 'Memento': 'Dark',
            'Pain Split': 'Normal', 'Perish Song': 'Normal',
            // Dragon
            'Dragon Claw': 'Dragon', 'Dragon Dance': 'Dragon', 'Dragonbreath': 'Dragon',
            'Outrage': 'Dragon', 'Hidden Power Dragon': 'Dragon',
            // Dark
            'Crunch': 'Dark', 'Pursuit': 'Dark', 'Taunt': 'Dark', 'Knock Off': 'Dark', 'Thief': 'Dark',
            'Mean Look': 'Normal', 'Torment': 'Dark',
            // Steel
            'Meteor Mash': 'Steel', 'Iron Tail': 'Steel', 'Metal Claw': 'Steel', 'Hidden Power Steel': 'Steel',
            // Status/Other commonly seen
            'Seismic Toss': 'Fighting', 'Night Shade': 'Ghost', 'Haze': 'Ice', 'Encore': 'Normal',
            'Disable': 'Normal', 'Endure': 'Normal', 'Flail': 'Normal', 'Reversal': 'Fighting',
            'Mirror Coat': 'Psychic', 'Refresh': 'Normal', 'Thunder Punch': 'Electric', 'Ice Punch': 'Ice',
            'Fire Punch': 'Fire', 'Dynamic Punch': 'Fighting', 'Thunderpunch': 'Electric', 'Firepunch': 'Fire',
            'Icepunch': 'Ice'
        };

        // Helper: Get move badge with type color
        function createMoveBadge(moveName) {
            const type = moveTypes[moveName] || 'Normal';
            const bgColor = typeColors[type] || '#A8A878';
            const textColor = getTextColor(bgColor);
            return `<span class="move-badge" style="background: ${bgColor}; color: ${textColor}; border: none;">${moveName}</span>`;
        }

        // Helper: Get Pokemon key from name
        function getPokemonKeyByName(name) {
            const pokemon = pokemonData.pokemon || {};
            for (const [key, mon] of Object.entries(pokemon)) {
                if (mon.name.toLowerCase() === name.toLowerCase()) return key;
            }
            return null;
        }

        // Helper: Calculate if text should be light or dark based on background
        function getTextColor(hexColor) {
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 128 ? '#000000' : '#FFFFFF';
        }

        // Helper: Get type gradient and text color for a Pokemon name
        function getTypeStyle(name) {
            const key = getPokemonKeyByName(name);
            if (!key) return { gradient: 'linear-gradient(90deg, #705898, #705898)', textColor: '#FFFFFF' };
            const mon = pokemonData.pokemon[key];
            if (!mon || !mon.types) return { gradient: 'linear-gradient(90deg, #705898, #705898)', textColor: '#FFFFFF' };

            const type1 = typeColors[mon.types[0]] || '#705898';
            const type2 = mon.types[1] ? typeColors[mon.types[1]] : type1;
            // Use darker of the two type colors to determine text color
            const textColor = getTextColor(type1);
            return {
                gradient: `linear-gradient(90deg, ${type1} 50%, ${type2} 50%)`,
                textColor: textColor
            };
        }

        // Helper: Create clickable Pokemon badge with sprite and type colors
        function createPokemonBadge(name, showSprite = true) {
            const key = getPokemonKeyByName(name);
            const style = getTypeStyle(name);
            const onclick = key ? `onclick="showPokemonDetail('${key}')"` : '';
            const spriteHtml = showSprite ? createSprite(name, 36) : '';
            return `<span class="pokemon-badge" ${onclick} style="background: ${style.gradient}; color: ${style.textColor}; cursor: ${key ? 'pointer' : 'default'}; text-shadow: ${style.textColor === '#000000' ? 'none' : '1px 1px 2px rgba(0,0,0,0.5)'};">${spriteHtml}<span class="pokemon-badge-name">${name}</span></span>`;
        }

        // Helper: Create sprite-only display (for team grids)
        function createSpriteOnly(name, size = 48) {
            const key = getPokemonKeyByName(name);
            const onclick = key ? `onclick="showPokemonDetail('${key}')"` : '';
            return `<div class="sprite-container" ${onclick} title="${name}" style="cursor: ${key ? 'pointer' : 'default'};">
                ${createSprite(name, size)}
                <span class="sprite-label">${name}</span>
            </div>`;
        }

        // =========================
        // Modular Linking System
        // =========================

        // Normalize Pokemon name for comparison
        function normalizeName(name) {
            return name.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        // Check if a Pokemon list contains a specific Pokemon
        function listContainsPokemon(list, pokemon) {
            const normalizedPokemon = normalizeName(pokemon);
            return list.some(p => normalizeName(p) === normalizedPokemon);
        }

        // Check if a Pokemon list contains ALL Pokemon from another list
        function listContainsAllPokemon(haystack, needles) {
            return needles.every(needle => listContainsPokemon(haystack, needle));
        }

        // Find ALL teams that contain ALL of the given Pokemon
        function findTeamsContainingPokemon(pokemonList) {
            const teams = sampleTeamsData.sample_teams || {};
            const matches = [];

            Object.entries(teams).forEach(([archKey, archetype]) => {
                archetype.teams.forEach(team => {
                    if (listContainsAllPokemon(team.team, pokemonList)) {
                        matches.push({
                            teamName: team.name,
                            teamId: team.name.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                            archetype: archetype.archetype,
                            author: team.author,
                            pokemon: team.team
                        });
                    }
                });
            });

            return matches;
        }

        // Find ALL archetypes that have ALL of the given Pokemon in their key_pokemon
        function findArchetypesContainingPokemon(pokemonList) {
            const archetypes = metagameData.archetypes || {};
            const matches = [];

            Object.entries(archetypes).forEach(([key, arch]) => {
                if (listContainsAllPokemon(arch.key_pokemon || [], pokemonList)) {
                    matches.push({ key, name: arch.name, keyPokemon: arch.key_pokemon });
                }
            });

            return matches;
        }

        // Find ALL cores where ALL Pokemon are in the given list
        function findCoresInPokemonList(pokemonList) {
            const cores = metagameData.key_cores || {};
            const matches = [];

            Object.entries(cores).forEach(([key, core]) => {
                if (listContainsAllPokemon(pokemonList, core.pokemon)) {
                    matches.push({ key, pokemon: core.pokemon, type: core.type });
                }
            });

            return matches;
        }

        // Parse a key feature to extract Pokemon and set hint
        // Handles: "HP Fire Magneton" -> link to Magneton's HP Fire set
        // Handles: "Crocune" -> link to Suicune's Calm Mind set
        // Handles: "SkarmBliss" -> link to Skarmory + Blissey core
        function parseFeature(feature) {
            const featureLower = feature.toLowerCase();

            // Known Pokemon names to look for
            const pokemonNames = Object.keys(pokemonData.pokemon || {});

            // Famous set nicknames (direct Pokemon + set mapping)
            const famousSetNames = {
                'crocune': { pokemon: 'suicune', setHint: 'calm_mind' },
                'manacune': { pokemon: 'suicune', setHint: 'calm' },
                'mixmence': { pokemon: 'salamence', setHint: 'mixed' },
                'mixed salamence': { pokemon: 'salamence', setHint: 'mixed' },
                'mixtar': { pokemon: 'tyranitar', setHint: 'mixed' },
                'ddtar': { pokemon: 'tyranitar', setHint: 'dragon_dance' },
                'dd tyranitar': { pokemon: 'tyranitar', setHint: 'dragon_dance' },
                'bkctar': { pokemon: 'tyranitar', setHint: 'physical' },
                'houdini': { pokemon: 'metagross', setHint: 'choice_band' },
                'houdini metagross': { pokemon: 'metagross', setHint: 'choice_band' }
            };

            // Check for famous set names first
            for (const [pattern, info] of Object.entries(famousSetNames)) {
                if (featureLower.includes(pattern)) {
                    const pokemonKey = Object.keys(pokemonData.pokemon || {}).find(k =>
                        pokemonData.pokemon[k].name.toLowerCase() === info.pokemon
                    );
                    if (pokemonKey) {
                        const mon = pokemonData.pokemon[pokemonKey];
                        // Find matching set
                        if (mon.sets) {
                            const matchedSet = Object.keys(mon.sets).find(sk =>
                                sk.toLowerCase().includes(info.setHint) || info.setHint.includes(sk.toLowerCase())
                            );
                            if (matchedSet) {
                                return { type: 'pokemonSet', pokemonKey, setKey: matchedSet };
                            }
                        }
                        return { type: 'pokemon', pokemonKey };
                    }
                }
            }

            // Core patterns (compound names and full names)
            const corePatterns = {
                'skarmbliss': ['Skarmory', 'Blissey'],
                'skarm bliss': ['Skarmory', 'Blissey'],
                'skarmdug': ['Skarmory', 'Dugtrio'],
                'skarm dug': ['Skarmory', 'Dugtrio'],
                'skarmmag': ['Skarmory', 'Magneton'],
                'skarm mag': ['Skarmory', 'Magneton'],
                'dragmag': ['Salamence', 'Magneton'],
                'drag mag': ['Salamence', 'Magneton'],
                'magnecune': ['Magneton', 'Suicune'],
                'magcune': ['Magneton', 'Suicune'],
                'mag cune': ['Magneton', 'Suicune'],
                'magneton suicune': ['Magneton', 'Suicune'],
                'zapdug': ['Zapdos', 'Dugtrio'],
                'zap dug': ['Zapdos', 'Dugtrio'],
                'zapdos dugtrio': ['Zapdos', 'Dugtrio'],
                'milodol': ['Milotic', 'Claydol'],
                'milo dol': ['Milotic', 'Claydol'],
                'cunedol': ['Suicune', 'Claydol'],
                'cune dol': ['Suicune', 'Claydol'],
                'magdol': ['Magneton', 'Claydol'],
                'mag dol': ['Magneton', 'Claydol'],
                'forredol': ['Forretress', 'Claydol'],
                'forre dol': ['Forretress', 'Claydol'],
                'aerobi': ['Aerodactyl', 'Tyranitar'],
                'aero bi': ['Aerodactyl', 'Tyranitar']
            };

            // Check for core pattern
            for (const [pattern, corePokemon] of Object.entries(corePatterns)) {
                if (featureLower.includes(pattern)) {
                    return { type: 'core', pokemon: corePokemon };
                }
            }

            // Set hint patterns (look for these in features containing Pokemon names)
            const setHintPatterns = {
                'hp fire': 'hp_fire',
                'hp ice': 'hp_ice',
                'hp grass': 'hp_grass',
                'hp ground': 'hp_ground',
                'hp bug': 'hp_bug',
                'choice band': 'choice_band',
                'banded': 'choice_band',
                'cb ': 'choice_band',
                'dragon dance': 'dragon_dance',
                'dd ': 'dragon_dance',
                'calm mind': 'calm_mind',
                'cm ': 'calm_mind',
                'swords dance': 'swords_dance',
                'sd ': 'swords_dance',
                'agility': 'agility',
                'substitute': 'substitute',
                'sub ': 'substitute',
                'rest': 'rest',
                'offensive': 'offensive',
                'defensive': 'defensive',
                'physical': 'physical',
                'special': 'special',
                'mixed': 'mixed',
                'lead': 'lead',
                'liechi': 'liechi',
                'salac': 'salac',
                'curse': 'curse',
                'wish': 'wish',
                'endeavor': 'endeavor',
                'baton pass': 'baton_pass'
            };

            // Try to find a Pokemon name in the feature
            for (const pokemonKey of pokemonNames) {
                const mon = pokemonData.pokemon[pokemonKey];
                if (!mon) continue;

                const monNameLower = mon.name.toLowerCase();
                if (featureLower.includes(monNameLower)) {
                    // Found a Pokemon, now look for a set hint
                    let setHint = null;

                    // Check for set hint patterns
                    for (const [pattern, hint] of Object.entries(setHintPatterns)) {
                        if (featureLower.includes(pattern)) {
                            setHint = hint;
                            break;
                        }
                    }

                    // Try to match set key in the Pokemon's sets
                    if (setHint && mon.sets) {
                        const matchedSet = Object.keys(mon.sets).find(sk => {
                            const setNameLower = mon.sets[sk].name.toLowerCase();
                            return sk.toLowerCase().includes(setHint) ||
                                   setHint.includes(sk.toLowerCase()) ||
                                   setNameLower.includes(setHint.replace('_', ' '));
                        });
                        if (matchedSet) {
                            return { type: 'pokemonSet', pokemonKey, setKey: matchedSet };
                        }
                    }

                    return { type: 'pokemon', pokemonKey };
                }
            }

            // Check for archetype keywords
            const archetypeKeywords = {
                'spikes offense': 'spikes_offense',
                'spikes stall': 'stall',
                'special offense': 'special_offense_dugtrio',
                'hyper offense': 'hyper_offense',
                'tss': 'tss_balance',
                'balance': 'tss_balance',
                'stall': 'stall',
                'rain': 'rain_dance',
                'superman': 'superman',
                'breloom charizard': 'breloom_charizard_offense'
            };

            for (const [keyword, archKey] of Object.entries(archetypeKeywords)) {
                if (featureLower.includes(keyword)) {
                    const archetypes = metagameData.archetypes || {};
                    if (archetypes[archKey]) {
                        return { type: 'archetype', key: archKey, name: archetypes[archKey].name };
                    }
                }
            }

            // Try to match archetype names directly
            const archetypes = metagameData.archetypes || {};
            for (const [key, arch] of Object.entries(archetypes)) {
                const archNameLower = arch.name.toLowerCase();
                if (featureLower.includes(archNameLower) ||
                    archNameLower.includes(featureLower) ||
                    featureLower.split(' ')[0] === archNameLower.split(' ')[0]) {
                    return { type: 'archetype', key, name: arch.name };
                }
            }

            return null;
        }

        // Show Pokemon detail with a specific set highlighted
        function showPokemonDetailWithSet(pokemonKey, setKey = null) {
            showPokemonDetail(pokemonKey, setKey);
        }

        // Legacy compatibility - find archetypes for core
        function findArchetypesForCore(corePokemon) {
            return findArchetypesContainingPokemon(corePokemon);
        }

        // Legacy compatibility - find teams for archetype (now uses Pokemon matching)
        function findTeamsForArchetype(archetypeKey, archetypeName) {
            const archetypes = metagameData.archetypes || {};
            const arch = archetypes[archetypeKey];
            if (!arch) return [];

            // Find teams that contain at least 2 of the archetype's key Pokemon
            const teams = sampleTeamsData.sample_teams || {};
            const matches = [];

            Object.entries(teams).forEach(([archKey, archetype]) => {
                archetype.teams.forEach(team => {
                    const overlap = (arch.key_pokemon || []).filter(kp =>
                        listContainsPokemon(team.team, kp)
                    );
                    // Match if team has at least 2 key Pokemon from the archetype
                    if (overlap.length >= 2) {
                        matches.push({
                            teamName: team.name,
                            teamId: team.name.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                            archetype: archetype.archetype,
                            author: team.author,
                            matchedPokemon: overlap
                        });
                    }
                });
            });

            return matches;
        }

        // Find cores that match a key feature
        function findCoreByFeature(feature) {
            const parsed = parseFeature(feature);
            if (parsed && parsed.type === 'core') {
                // Find the core that matches these Pokemon
                const cores = metagameData.key_cores || {};
                for (const [key, core] of Object.entries(cores)) {
                    if (listContainsAllPokemon(core.pokemon, parsed.pokemon) &&
                        listContainsAllPokemon(parsed.pokemon, core.pokemon)) {
                        return { key, core };
                    }
                }
            }
            return null;
        }


        // Find archetype that matches a key feature
        function findArchetypeByFeature(feature) {
            const archetypes = metagameData.archetypes || {};
            const featureLower = feature.toLowerCase();

            for (const [key, arch] of Object.entries(archetypes)) {
                const archName = arch.name.toLowerCase();
                if (archName.includes(featureLower) || featureLower.includes(archName.split(' ')[0])) {
                    return { key, archetype: arch };
                }
            }
            return null;
        }

        // =========================
        // Navigation History (Enhanced)
        // =========================
        const navHistory = [];
        let navHistoryIndex = -1;

        // Helper: Get current tab ID
        function getCurrentTabId() {
            const activeTab = document.querySelector('.nav-tab.active');
            return activeTab ? activeTab.dataset.section : 'pokemon';
        }

        // Helper: Get current app state (includes modal state)
        function getCurrentState() {
            const detailView = document.getElementById('detail-view');
            const detailOpen = detailView && detailView.classList.contains('active');
            const detailContent = document.getElementById('detail-content');

            return {
                tabId: getCurrentTabId(),
                scrollY: detailOpen ? parseInt(document.body.dataset.scrollY || 0) : window.scrollY,
                modalType: detailOpen ? 'pokemon' : null,
                modalKey: detailOpen && detailContent ? detailContent.dataset.pokemonKey : null,
                highlightSet: detailOpen && detailContent ? detailContent.dataset.highlightSet : null,
                timestamp: Date.now()
            };
        }

        // Helper: Add state to history
        function addToHistory(state) {
            // Remove any forward history when making new navigation
            navHistory.splice(navHistoryIndex + 1);

            // Add new state
            navHistory.push(state);
            navHistoryIndex = navHistory.length - 1;

            // Update button states
            updateNavButtons();
        }

        // Helper: Restore a history state
        function restoreState(state) {
            // Close any open modals first (without adding to history)
            const detailView = document.getElementById('detail-view');
            if (detailView && detailView.classList.contains('active')) {
                detailView.classList.remove('active');
                unlockBodyScroll();
            }

            // Switch to correct tab
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

            const tab = document.querySelector(`[data-section="${state.tabId}"]`);
            const section = document.getElementById(state.tabId);

            if (tab) tab.classList.add('active');
            if (section) section.classList.add('active');

            // Restore scroll position
            window.scrollTo(0, state.scrollY || 0);

            // Re-open modal if it was open
            if (state.modalType === 'pokemon' && state.modalKey) {
                setTimeout(() => {
                    showPokemonDetailInternal(state.modalKey, state.highlightSet);
                }, 50);
            }
        }

        // Navigate to a specific tab and scroll to element
        function navigateToSection(tabId, elementId = null, addToHistoryFlag = true) {
            // Save current state to history before navigating
            if (addToHistoryFlag) {
                addToHistory(getCurrentState());
            }

            // Close any open modal first
            const detailView = document.getElementById('detail-view');
            if (detailView && detailView.classList.contains('active')) {
                detailView.classList.remove('active');
                unlockBodyScroll();
            }

            // Switch tab
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

            document.querySelector(`[data-section="${tabId}"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');

            window.scrollTo(0, 0);

            // Highlight element if specified
            if (elementId) {
                setTimeout(() => {
                    const el = document.getElementById(elementId);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('highlight');
                        setTimeout(() => el.classList.remove('highlight'), 2000);
                    }
                }, 100);
            }
        }

        function navigateBack() {
            if (navHistoryIndex > 0) {
                navHistoryIndex--;
                const state = navHistory[navHistoryIndex];
                restoreState(state);
                updateNavButtons();
            }
        }

        function navigateForward() {
            if (navHistoryIndex < navHistory.length - 1) {
                navHistoryIndex++;
                const state = navHistory[navHistoryIndex];
                restoreState(state);
                updateNavButtons();
            }
        }

        function updateNavButtons() {
            const backBtn = document.getElementById('nav-back');
            const fwdBtn = document.getElementById('nav-forward');
            if (backBtn) backBtn.disabled = navHistoryIndex <= 0;
            if (fwdBtn) fwdBtn.disabled = navHistoryIndex >= navHistory.length - 1;
        }

        // =========================
        // Body Scroll Lock (for modals)
        // =========================
        function lockBodyScroll() {
            const scrollY = window.scrollY;
            document.body.dataset.scrollY = scrollY;
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.top = `-${scrollY}px`;
            document.body.style.width = '100%';
            document.body.classList.add('modal-open');
        }

        function unlockBodyScroll() {
            const scrollY = document.body.dataset.scrollY;
            document.body.style.overflow = '';
            document.body.style.position = '';
            document.body.style.top = '';
            document.body.style.width = '';
            document.body.classList.remove('modal-open');

            if (scrollY) {
                window.scrollTo(0, parseInt(scrollY));
            }
        }

        // Handle key feature click - uses modular parseFeature system
        function handleFeatureClick(feature) {
            const parsed = parseFeature(feature);

            if (!parsed) return;

            switch (parsed.type) {
                case 'pokemonSet':
                    // Link to specific Pokemon set
                    showPokemonDetail(parsed.pokemonKey, parsed.setKey);
                    break;

                case 'pokemon':
                    // Link to Pokemon (no specific set)
                    showPokemonDetail(parsed.pokemonKey);
                    break;

                case 'core':
                    // Find the core that matches these Pokemon
                    const cores = metagameData.key_cores || {};
                    for (const [key, core] of Object.entries(cores)) {
                        if (listContainsAllPokemon(core.pokemon, parsed.pokemon) &&
                            listContainsAllPokemon(parsed.pokemon, core.pokemon)) {
                            navigateToSection('cores', `core-${key}`);
                            return;
                        }
                    }
                    break;

                case 'archetype':
                    navigateToSection('archetypes', `archetype-${parsed.key}`);
                    break;
            }
        }

        // Load JSON data
        async function loadData() {
            try {
                const [pokemonRes, metagameRes, teamsRes, speedRes] = await Promise.all([
                    fetch('knowledge_base/pokemon_sets.json'),
                    fetch('knowledge_base/metagame_overview.json'),
                    fetch('../adv-ou-sample-teams.json'),
                    fetch('../adv-ou-speed-tiers.json')
                ]);

                pokemonData = await pokemonRes.json();
                metagameData = await metagameRes.json();
                sampleTeamsData = await teamsRes.json();
                speedTiersData = await speedRes.json();

                renderPokemonList();
                renderMetagame();
                renderArchetypes();
                renderCores();
                renderSampleTeams();
                renderSpeedTiers();
                populateCalculator();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('pokemon-list').innerHTML =
                    '<div class="card"><p>Error loading data. Make sure JSON files are accessible.</p></div>';
            }
        }

        // Render Pokemon list by viability tier
        function renderPokemonList(filter = '') {
            const container = document.getElementById('pokemon-list');
            const pokemon = pokemonData.pokemon || {};

            const tiers = { S: [], A: [], B: [], C: [] };

            Object.entries(pokemon).forEach(([key, mon]) => {
                if (filter && !mon.name.toLowerCase().includes(filter.toLowerCase())) return;
                if (tiers[mon.viability]) {
                    tiers[mon.viability].push({ key, ...mon });
                }
            });

            let html = '';

            ['S', 'A', 'B', 'C'].forEach(tier => {
                if (tiers[tier].length === 0) return;

                html += `
                    <div class="tier-section">

                        <div class="pokemon-grid">

                `;
            });

            container.innerHTML = html || '<div class="card"><p>No Pokemon found.</p></div>';

                        <p class="mt-2"><strong class="text-ruby">Targets:</strong> ${meta.trapping_guide?.magneton?.common_targets?.join(', ')}</p>
                        <p class="text-secondary mt-2">${meta.trapping_guide?.magneton?.notes}</p>
                        ${meta.trapping_guide?.magneton?.common_sets ? `

                            <p class="mt-2"><strong>Magnet Item:</strong> <span class="font-mono text-sm">${meta.trapping_guide.magneton.common_sets.magnet_item || ''}</span></p>
                            <p class="mt-2"><strong>Endure Salac:</strong> <span class="font-mono text-sm">${meta.trapping_guide.magneton.common_sets.endure_salac || ''}</span></p>
                        ` : ''}

                    ${meta.trapping_guide?.counter_trapping ? `
                        <div class="set-card mt-4">
                            <h4>Counter-Trapping</h4>

                            ${meta.trapping_guide.counter_trapping.yolo_skarm ? `<p class="mt-2"><strong>Yolo Skarm:</strong> <span class="text-secondary">${meta.trapping_guide.counter_trapping.yolo_skarm}</span></p>` : ''}

        // Render archetypes
        function renderArchetypes() {
            const container = document.getElementById('archetypes-content');
            const archetypes = metagameData.archetypes || {};

            let html = '<div class="info-grid">';

            Object.entries(archetypes).forEach(([key, arch]) => {
                // Find cores where ALL core Pokemon are in this archetype's key_pokemon
                const relatedCores = findCoresInPokemonList(arch.key_pokemon || []);
                // Find teams that have at least 2 key Pokemon from this archetype
                const relatedTeams = findTeamsForArchetype(key, arch.name);

                html += `
                    <div class="card" id="archetype-${key}">
                        <h2 class="card-title">${arch.name}</h2>
                        <p class="text-secondary mb-4">${arch.description}</p>
                        <h3 class="section-subheader mt-4">Key Pokemon</h3>
                        <div class="moves-list">
                            ${arch.key_pokemon.map(p => createPokemonBadge(p)).join('')}
                        </div>
                        ${relatedCores.length > 0 ? `
                            <h3 class="section-subheader">Related Cores</h3>
                            <div class="moves-list">
                                ${relatedCores.map(c => `<span class="link-tag" onclick="navigateToSection('cores', 'core-${c.key}')">${c.pokemon.join(' + ')}</span>`).join('')}
                            </div>
                        ` : ''}
                        <h3 class="section-subheader">Gameplan</h3>
                        <p class="card-body">${arch.gameplan}</p>
                        ${arch.notes ? `<p class="text-secondary mt-3" style="font-style: italic;">${arch.notes}</p>` : ''}
                        ${relatedTeams.length > 0 ? `
                            <h3 class="section-subheader">Sample Teams</h3>
                            <div class="moves-list">
                                ${relatedTeams.slice(0, 8).map(t => `<span class="link-tag team-link" onclick="navigateToSection('teams', 'team-${t.teamId}')">${t.teamName}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Render cores
        function renderCores() {
            const container = document.getElementById('cores-content');
            const cores = metagameData.key_cores || {};

            let html = '<div class="info-grid">';

            Object.entries(cores).forEach(([key, core]) => {
                // Find archetypes that contain ALL core Pokemon
                const relatedArchetypes = findArchetypesContainingPokemon(core.pokemon);
                // Find teams that contain ALL core Pokemon
                const relatedTeams = findTeamsContainingPokemon(core.pokemon);

                html += `
                    <div class="card" id="core-${key}">
                        <div class="flex justify-between items-start mb-3">
                            <h2 class="card-title">${core.pokemon.join(' + ')}</h2>
                            <span class="archetype-badge ${core.type === 'Offensive' ? 'offensive' : core.type === 'Defensive' ? 'defensive' : 'balanced'}">${core.type}</span>
                        </div>
                        <div class="moves-list mb-4">
                            ${core.pokemon.map(p => createPokemonBadge(p)).join('')}
                        </div>
                        <p class="text-secondary mb-4">${core.description}</p>
                        ${core.synergy ? `
                            <h3 class="section-subheader mt-4">Synergy</h3>
                            <p class="card-body">${core.synergy}</p>
                        ` : ''}
                        ${core.strategy ? `
                            <h3 class="section-subheader">Strategy</h3>
                            <p class="card-body">${core.strategy}</p>
                        ` : ''}
                        ${core.notes ? `<p class="text-secondary mt-3" style="font-style: italic;">${core.notes}</p>` : ''}
                        ${core.weaknesses ? `
                            <h3 class="section-subheader">Weaknesses</h3>
                            <p class="text-ruby">${core.weaknesses.join(', ')}</p>

                            <h3 class="section-subheader">Used In Archetypes</h3>
                            <div class="moves-list">
                                ${relatedArchetypes.map(a => `<span class="link-tag" onclick="navigateToSection('archetypes', 'archetype-${a.key}')">${a.name}</span>`).join('')}
                            </div>
                        ` : ''}
                        ${relatedTeams.length > 0 ? `
                            <h3 class="section-subheader">Sample Teams Using This Core</h3>
                            <div class="moves-list">
                                ${relatedTeams.slice(0, 8).map(t => `<span class="link-tag team-link" onclick="navigateToSection('teams', 'team-${t.teamId}')">${t.teamName}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;

            html += '</div>';
            container.innerHTML = html;

        // Render sample teams
        function renderSampleTeams(filter = '') {
            const container = document.getElementById('teams-content');
            const teams = sampleTeamsData.sample_teams || {};
            const filterLower = filter.toLowerCase();

            let html = `
                <div class="card">
                    <h2>ADV OU Sample Teams</h2>
                    <p class="text-secondary">${sampleTeamsData.description || 'Official curated sample teams organized by playstyle'}</p>
                    <p class="mt-3"><a href="${sampleTeamsData.source_url}" target="_blank">Source: ${sampleTeamsData.source}</a></p>
                </div>
            `;

            Object.entries(teams).forEach(([archKey, archetype]) => {
                // Filter teams based on search
                const filteredTeams = archetype.teams.filter(team => {
                    if (!filter) return true;
                    const searchStr = [
                        team.name,
                        team.author,
                        team.description,
                        ...team.team,
                        ...(team.key_features || [])
                    ].join(' ').toLowerCase();
                    return searchStr.includes(filterLower);
                });

                if (filteredTeams.length === 0) return;

                html += `
                    <div class="card">
                        <h2>${archetype.archetype}</h2>
                        <p class="text-secondary mb-3">${archetype.description}</p>
                        <span class="archetype-badge ${getDifficultyClass(archetype.difficulty)}">${archetype.difficulty}</span>
                `;

                filteredTeams.forEach(team => {
                    const teamId = team.name.toLowerCase().replace(/[^a-z0-9]/g, '-');
                    // Find cores present in this team using the modular system
                    const teamCores = findCoresInPokemonList(team.team);

                    html += `
                        <div class="set-card mt-4" id="team-${teamId}">
                            <h4>${team.name}</h4>
                            <p class="text-secondary text-sm">by ${team.author} (${team.year})</p>
                            <div class="sprite-grid mt-3 mb-3">
                                ${team.team.map(p => createSpriteOnly(p, 56)).join('')}
                            </div>
                            <p>${team.description}</p>
                            ${teamCores.length > 0 ? `
                                <p class="mt-3 font-semibold">Cores:</p>
                                <div class="moves-list">
                                    ${teamCores.map(c => `<span class="link-tag" onclick="navigateToSection('cores', 'core-${c.key}')">${c.pokemon.join(' + ')}</span>`).join('')}
                                </div>
                            ` : ''}
                            ${team.key_features ? `
                                <p class="mt-3 font-semibold">Key Features:</p>
                                <div class="moves-list">
                                    ${team.key_features.map(f => `<span class="link-tag" onclick="handleFeatureClick('${f.replace(/'/g, "\\'")}')">${f}</span>`).join('')}
                                </div>
                            ` : ''}
                            ${team['2024_trends'] ? `<p class="mt-3 text-secondary" style="font-style: italic;"><strong>2024 Trends:</strong> ${team['2024_trends']}</p>` : ''}
                            <a href="${team.pokepaste}" target="_blank" class="btn btn-primary mt-4" style="display: inline-block;">Import from Pokepaste</a>
                        </div>
                    `;
                });

                html += '</div>';
            });

            // Add team dumps section
            if (sampleTeamsData.team_dumps && (!filter || 'team dumps'.includes(filterLower))) {
                html += `
                    <div class="card">
                        <h2>Team Dumps</h2>
                        <p class="text-secondary">${sampleTeamsData.team_dumps.description}</p>
                        <div class="mt-4">
                            ${sampleTeamsData.team_dumps.recommended_for_learning.map(dump => `
                                <div class="set-card">
                                    <h4>${dump.author} (${dump.year})</h4>
                                    <p>${dump.description}</p>
                                    <a href="${dump.url}" target="_blank">View Collection</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html || '<div class="card"><p>No teams found matching your search.</p></div>';
        }

        // Helper: Get difficulty badge class
        function getDifficultyClass(difficulty) {
            if (!difficulty) return 'balanced';
            const d = difficulty.toLowerCase();
            if (d.includes('beginner')) return 'beginner';
            if (d.includes('intermediate')) return 'intermediate';
            if (d.includes('advanced')) return 'advanced';
            return 'balanced';
        }

        // Render speed tiers
        function renderSpeedTiers() {
            const container = document.getElementById('speed-content');
            const data = speedTiersData;

            let html = `
                <div class="card">
                    <h2>ADV OU Speed Tiers</h2>
                    <p class="text-secondary">${data.speed_tiers_overview?.description || 'Critical speed benchmarks in ADV OU'}</p>
                </div>

                <div class="card">
                    <h2>Speed Calculation Formulas</h2>
                    <div class="set-card">
                        <p><strong>Swift Swim / Agility (+2):</strong> ${data.speed_tiers_overview?.formulas?.swift_swim_agility}</p>
                        <p><strong>Dragon Dance / Salac (+1):</strong> ${data.speed_tiers_overview?.formulas?.dragon_dance_salac}</p>
                    </div>
                    <div class="set-card">
                        <p><strong>Example (Swift Swim):</strong> ${data.speed_tiers_overview?.formulas?.example_swift_swim}</p>
                        <p><strong>Example (Dragon Dance):</strong> ${data.speed_tiers_overview?.formulas?.example_dragon_dance}</p>
                    </div>
                </div>
            `;

            // Practical Speed Tiers
            const tiers = data.practical_speed_tiers || {};
            html += `<div class="card"><h2>Practical Speed Tiers</h2>`;

            Object.entries(tiers).forEach(([tierKey, tier]) => {
                html += `
                    <div class="set-card">
                        <h4 style="color: ${getTierColor(tierKey)};">${tier.range} - ${tier.description}</h4>
                        <div class="speed-tier-list mt-3">
                            ${tier.pokemon.map(p => `
                                <div class="speed-tier-item">
                                    <span class="speed-tier-pokemon">${createPokemonBadge(p.name)}</span>
                                    <span class="speed-tier-details">${p.set || p.condition || ''}</span>
                                    <span class="speed-tier-number">${p.speed}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            // Key Benchmarks
            const benchmarks = data.key_benchmarks || {};
            html += `<div class="card"><h2>Key Speed Benchmarks</h2><div class="info-grid">`;

            Object.entries(benchmarks)
                .sort((a, b) => parseInt(b[0]) - parseInt(a[0]))
                .forEach(([speed, info]) => {
                    html += `
                        <div class="set-card">
                            <div class="flex justify-between items-center mb-3">
                                <h4>${info.description}</h4>
                                <span class="speed-number">${speed}</span>
                            </div>
                            <div class="moves-list mb-3">
                                ${info.pokemon.map(p => createPokemonBadge(p)).join('')}
                            </div>
                            <p class="text-sm"><strong>Nature:</strong> ${info.nature} | <strong>EVs:</strong> ${info.evs}</p>
                            <p class="text-secondary">${info.significance}</p>
                            ${info.note ? `<p class="text-sm text-sapphire mt-2" style="font-style: italic;">${info.note}</p>` : ''}
                        </div>
                    `;
                });
            html += '</div></div>';

            // Boosted Speeds
            const boosted = data.boosted_speeds || {};
            html += `<div class="card"><h2>Boosted Speed Threats</h2>`;

            if (boosted.dragon_dance_plus_one) {
                html += `
                    <div class="set-card">
                        <h4>Dragon Dance / Salac Berry (+1 Speed)</h4>
                        <p class="text-secondary">${boosted.dragon_dance_plus_one.description}</p>
                        <p><strong>Formula:</strong> ${boosted.dragon_dance_plus_one.formula}</p>
                        <div class="speed-tier-list mt-3">
                            ${Object.entries(boosted.dragon_dance_plus_one.common_threats || {}).map(([speed, info]) => `
                                <div class="speed-tier-item">
                                    <span>${createPokemonBadge(info.pokemon)} <span class="text-secondary text-sm">(${info.unboosted} unboosted)</span></span>
                                    <span class="speed-number ml-auto">+1: ${speed}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (boosted.agility_plus_two) {
                html += `
                    <div class="set-card">
                        <h4>Agility (+2 Speed)</h4>
                        <p class="text-secondary">${boosted.agility_plus_two.description}</p>
                        <p><strong>Formula:</strong> ${boosted.agility_plus_two.formula}</p>
                        <div class="speed-tier-list mt-3">
                            ${Object.entries(boosted.agility_plus_two.common_threats || {}).map(([speed, info]) => `
                                <div class="speed-tier-item">
                                    <span>${Array.isArray(info.pokemon) ? info.pokemon.map(p => createPokemonBadge(p)).join(' ') : createPokemonBadge(info.pokemon)} <span class="text-secondary text-sm">(${info.unboosted || ''} unboosted)</span></span>
                                    <span class="speed-number ml-auto">+2: ${speed}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (boosted.swift_swim_rain) {
                html += `
                    <div class="set-card">
                        <h4>Swift Swim (Rain)</h4>
                        <p class="text-secondary">${boosted.swift_swim_rain.description}</p>
                        <p><strong>Mechanics:</strong> ${boosted.swift_swim_rain.mechanics}</p>
                        <div class="speed-tier-list mt-3">
                            ${Object.entries(boosted.swift_swim_rain.common_users || {}).map(([key, info]) => `
                                <div class="speed-tier-item">
                                    ${createPokemonBadge(info.pokemon)}
                                    <span class="text-secondary flex-1">${info.significance}</span>
                                    ${info.boosted ? `<span class="speed-number">Rain: ${info.boosted}</span>` : ''}
                                </div>

                        </div>

            }

            html += '</div>';

            // Speed Creep Guide
            const creep = data.speed_creep_guide || {};
            html += `
                <div class="card">
                    <h2>Speed Creep Guide</h2>
                    <p class="text-secondary mb-4">${creep.description || ''}</p>
                    ${Object.entries(creep.targets || {}).map(([key, target]) => `
                        <div class="set-card">
                            <div class="flex justify-between items-center mb-3">
                                <h4>${key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</h4>
                                <span class="speed-number">${target.target_speed}</span>
                            </div>
                            <p>${target.reasoning}</p>
                            ${target.common_users ? `<p class="mt-2"><strong>Common Users:</strong> ${target.common_users.join(', ')}</p>` : ''}

            // Meta Notes
            const meta = data.meta_notes || {};
            html += `
                <div class="card">
                    <h2>Important Considerations</h2>
                    <ul>
                        ${(meta.important_considerations || []).map(note => `<li class="mb-2">${note}</li>`).join('')}
                    </ul>
                    ${meta.trapping_considerations ? `
                        <h3 class="mt-6">Trapping & Speed</h3>
                        <ul class="mt-3">
                            ${Object.entries(meta.trapping_considerations).map(([mon, note]) => `<li class="mb-2"><strong>${mon.charAt(0).toUpperCase() + mon.slice(1)}:</strong> ${note}</li>`).join('')}
                        </ul>
                    ` : ''}
                </div>
            `;

            container.innerHTML = html;

        // Helper: Get tier color for speed tiers
        function getTierColor(tierKey) {
            const colors = {
                'tier_0_extreme': 'var(--type-psychic)',
                'tier_1_blazing': 'var(--type-fire)',
                'tier_2_fast': 'var(--color-electric)',
                'tier_3_moderate': 'var(--color-emerald)',
                'tier_4_bulky': 'var(--color-sapphire)',
                'tier_5_slow': 'var(--type-flying)'
            };
            return colors[tierKey] || 'var(--color-sapphire)';
        }

        // Populate calculator dropdowns
        function populateCalculator() {
            const attackerSelect = document.getElementById('calc-attacker');
            const defenderSelect = document.getElementById('calc-defender');

            const pokemon = pokemonData.pokemon || {};
            const options = Object.entries(pokemon)
                .sort((a, b) => a[1].name.localeCompare(b[1].name))
                .map(([key, mon]) => `<option value="${key}">${mon.name}</option>`)
                .join('');

            attackerSelect.innerHTML = '<option value="">Select Attacker</option>' + options;
            defenderSelect.innerHTML = '<option value="">Select Defender</option>' + options;

            attackerSelect.addEventListener('change', updateAttackerSets);
            defenderSelect.addEventListener('change', updateDefenderSets);
            document.getElementById('calc-attacker-set').addEventListener('change', updateMoves);
        }

        function updateAttackerSets() {
            const key = document.getElementById('calc-attacker').value;
            const setSelect = document.getElementById('calc-attacker-set');
            const mon = pokemonData.pokemon[key];

            if (!mon || !mon.sets) {
                setSelect.innerHTML = '<option value="">No sets available</option>';
                return;
            }

            setSelect.innerHTML = Object.entries(mon.sets)
                .map(([k, s]) => `<option value="${k}">${s.name}</option>`)
                .join('');

            updateMoves();
        }

        function updateDefenderSets() {
            const key = document.getElementById('calc-defender').value;
            const setSelect = document.getElementById('calc-defender-set');
            const mon = pokemonData.pokemon[key];

            if (!mon || !mon.sets) {
                setSelect.innerHTML = '<option value="">No sets available</option>';
                return;
            }

            setSelect.innerHTML = Object.entries(mon.sets)
                .map(([k, s]) => `<option value="${k}">${s.name}</option>`)
                .join('');
        }

        function updateMoves() {
            const pokemonKey = document.getElementById('calc-attacker').value;
            const setKey = document.getElementById('calc-attacker-set').value;
            const moveSelect = document.getElementById('calc-move');

            const mon = pokemonData.pokemon[pokemonKey];
            if (!mon || !mon.sets || !mon.sets[setKey]) {
                moveSelect.innerHTML = '<option value="">Select a set first</option>';
                return;
            }

            const moves = mon.sets[setKey].moves;
            moveSelect.innerHTML = moves
                .map(m => `<option value="${m}">${m}</option>`)
                .join('');
        }

        // Calculate damage - calls API if server is running, otherwise shows preview
        document.getElementById('calc-btn').addEventListener('click', async function() {
            const attacker = document.getElementById('calc-attacker').value;
            const attackerSet = document.getElementById('calc-attacker-set').value;
            const move = document.getElementById('calc-move').value;
            const defender = document.getElementById('calc-defender').value;
            const defenderSet = document.getElementById('calc-defender-set').value;

            if (!attacker || !defender || !move) {
                alert('Please select attacker, defender, and move.');
                return;
            }

            const result = document.getElementById('calc-result');
            result.classList.remove('hidden');
            result.textContent = 'Calculating...';

            // Try to call the API
            try {
                const params = new URLSearchParams({
                    attacker: attacker,
                    attacker_set: attackerSet,
                    defender: defender,
                    defender_set: defenderSet,
                    move: move,
                    weather: 'sand'  // Default to sand (Tyranitar's Sand Stream)
                });

                const response = await fetch(`/api/calc?${params}`);
                const data = await response.json();

                if (data.success) {
                    const r = data.result;
                    result.textContent = `
${data.attacker.name} (${data.attacker.set || 'default'}) @ ${data.attacker.item || 'no item'}
  ${move}
vs
${data.defender.name} (${data.defender.set || 'default'})

Damage: ${r.min_damage} - ${r.max_damage} (${r.min_percent}% - ${r.max_percent}%)
${r.ko_chance}

Critical Hit: ${r.crit_min} - ${r.crit_max} (${r.crit_min_percent}% - ${r.crit_max_percent}%)

Attacker Stats: ${data.attacker.stats.atk} Atk / ${data.attacker.stats.spa} SpA / ${data.attacker.stats.spe} Spe
Defender HP: ${data.defender.hp}
Weather: ${data.weather}
                    `;
                } else {
                    result.textContent = `Error: ${data.error}`;
                }
            } catch (e) {
                // API not available - show preview with local data
                const atkMon = pokemonData.pokemon[attacker];
                const defMon = pokemonData.pokemon[defender];
                const atkSetData = atkMon.sets[attackerSet];
                const defSetData = defMon.sets[defenderSet];

                result.textContent = `
Calculation Preview (Server not running):
-----------------------------------------
${atkMon.name} (${atkSetData?.name || 'default'})
  ${move}
vs
${defMon.name} (${defSetData?.name || 'default'})

Attacker Stats: ${atkMon.base_stats.atk} Atk / ${atkMon.base_stats.spa} SpA
Defender Stats: ${defMon.base_stats.hp} HP / ${defMon.base_stats.def} Def / ${defMon.base_stats.spd} SpD

To run full calculations, start the server:
  cd adv-ou && python3 server.py

Or use CLI:
  python3 tools/damage_calc.py ${attacker} "${move}" ${defender}
                `;
            }
        });

        // Navigation - use navigateToSection for history tracking
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                const targetSection = this.dataset.section;

                // Only navigate if switching to a different tab
                if (targetSection !== getCurrentTabId()) {
                    navigateToSection(targetSection, null, true);
                }
            });
        });

        // Search
        document.getElementById('pokemon-search').addEventListener('input', function() {
            renderPokemonList(this.value);
        });

        document.getElementById('teams-search').addEventListener('input', function() {
            renderSampleTeams(this.value);
        });

        // Close modal on escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDetail();
        });

        // Initialize history on page load
        window.addEventListener('load', () => {
            addToHistory(getCurrentState());
        });

        // Load data on page load
        loadData();
